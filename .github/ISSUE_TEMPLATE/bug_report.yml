name: Bug report
description: Report a bug of this Shizuku fork

body:
  - type: checkboxes
    id: requirements
    attributes:
      label: Requirements
      options:
        - label: Shizuku is downloaded from this fork's GitHub Releases or built from this repository
        - label: The issue reproduces without a virtual environment or a broken ROM
        - label: "(Root users) No Xposed module is enabled for Shizuku"

  - type: input
    id: version
    attributes:
      label: Latest installed version
    validations:
      required: true

  - type: input
    id: shizuku_version
    attributes:
      label: Version in use
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - adb
        - root
        - manual
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: What did you do

  - type: textarea
    id: logs
    attributes:
      label: What happened
      description: You can upload log and screenshot

  - type: textarea
    id: expected-behaviour
    attributes:
      label: What do you expect
